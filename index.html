/* ---------- Telas novas e abas ---------- */
const tirarBar=h=>{const i=h.indexOf('</div>');return [h.slice(0,i+6),h.slice(i+6)]};
const _pessoas=V.pessoas,_agenda=V.agenda,_equipe=V.equipe;
V.pessoas=function(){if(S.pid&&visP().some(p=>p.id===S.pid))return _pessoas();
  if(S.fid&&familias.some(f=>f.id===S.fid))return famVista(familias.find(f=>f.id===S.fid));
  const sg=seg('pv',S.pv,[['pes','Pessoas'],['fam','Famílias']]);
  if(S.pv!=='fam'){const [b,r]=tirarBar(_pessoas());return b+sg+r}
  const fs=famLista();
  return `${bar('Pessoas')}${sg}<label class="search"><span class="vh">Buscar família</span>${ic('search',20)}<input id="fq" type="search" value="${esc(S.fq||'')}" placeholder="Nome de qualquer morador, telefone ou endereço"></label>
  <select id="fvila" aria-label="Vila"><option value="">Todas as vilas</option>${minhasVilas().filter(v=>vivos().some(p=>p.vila===v.id)).map(v=>`<option value="${v.id}"${S.vila===v.id?' selected':''}>${esc(v.nome)}</option>`).join('')}</select>
  <p class="meta" id="fcont">${fs.length} ${fs.length===1?'família':'famílias'}. Cada família é uma casa, com o nome do responsável. Toque para ver quem é quem, os parentes que moram em outra casa e os pedidos de todos.</p>
  <div id="flist">${list(fs.map(famRow),'Nenhuma família encontrada.')}</div>`};
V.agenda=function(){const sg=seg('agt',S.agt,[['ag','Compromissos'],['vis','Visitas feitas']]);if(S.agt!=='vis'){const [b,r]=tirarBar(_agenda());return b+sg+r}return `${bar('Agenda')}${sg}${visAba()}`};
V.equipe=function(){const ops=[['org','Organização']].concat(S.perfil!=='lider'?[['rank','Ranking']]:[]).concat(S.perfil==='geral'?[['log','Registro'+(LOG.some(precisaConf)?' ('+LOG.filter(precisaConf).length+')':'')]]:[]),sg=ops.length>1?seg('eqt',S.eqt,ops):'';
  if(S.eqt==='rank'&&S.perfil!=='lider')return `${bar('Equipe')}${sg}${rankAba()}`;
  if(S.eqt==='log'&&S.perfil==='geral')return `${bar('Equipe')}${sg}${logAba()}`;
  const [b,r]=tirarBar(_equipe());return b+sg+r};
V.entidades=function(){const e=S.eid&&eById(S.eid);if(e&&!e.arq&&visE().includes(e))return entVista(e);
  const es=filtraE(),ts=Object.keys(ENT_T).filter(t=>visE().some(e=>e.tipo===t));
  return `${bar('Entidades','',`<button class="btn sm" data-act="novaent">${ic('plus',16)}Cadastrar</button>`)}
  <p class="meta">Associações, igrejas, escolas, cooperativas e times de cada vila. Cadastro separado das pessoas: a entidade tem responsável, pessoas ligadas, pedidos e ofícios próprios.</p>
  <label class="search"><span class="vh">Buscar entidade</span>${ic('search',20)}<input id="eq" type="search" value="${esc(S.eq||'')}" placeholder="Buscar entidade"></label>
  <select id="evila" aria-label="Vila"><option value="">Todas as vilas</option>${minhasVilas().filter(v=>visE().some(e=>e.vila===v.id)).map(v=>`<option value="${v.id}"${S.evila===v.id?' selected':''}>${esc(v.nome)}</option>`).join('')}</select>
  <div class="scroll rgtabs"><button class="chip" data-act="etipo" data-id="" aria-pressed="${!S.etipo}">Todas <span class="cnum">${visE().length}</span></button>${ts.map(t=>`<button class="chip" data-act="etipo" data-id="${t}" aria-pressed="${S.etipo===t}">${t} <span class="cnum">${visE().filter(e=>e.tipo===t).length}</span></button>`).join('')}</div>
  <div id="elist">${list(es.map(eRow),'Nenhuma entidade encontrada. Use o botão Cadastrar.')}</div>`};
V.oficios=function(){if(S.perfil==='lider')return `${bar('Ofícios')}<p class="empty">O controle de ofícios fica com a coordenação.</p>`;
  const os=visO(),f=S.ofst,xs=os.filter(o=>!f||(f==='late'?ofLate(o):o.st===f)).slice().sort((a,b)=>(ofLate(b)-ofLate(a))||b.data.localeCompare(a.data));
  return `${bar('Ofícios e indicações','',`<button class="btn sm" data-act="novoof">${ic('plus',16)}Novo ofício</button>`)}
  <div class="kpis">${[['mail','#c98a00','Aguardando resposta',os.filter(o=>o.st==='aguardando').length,'aguardando'],['cal','#d93c3c','Sem resposta no prazo',os.filter(ofLate).length,'late'],['chat','#efb100','Responderam',os.filter(o=>o.st==='respondido').length,'respondido'],['heart','#1f9a52','Atenderam',os.filter(o=>o.st==='atendido').length,'atendido']].map(k=>`<button class="kpi kbtn" data-act="ofst" data-id="${k[4]}" aria-pressed="${f===k[4]}"><span class="cic cc" style="--cc:${k[1]}">${ic(k[0],20)}</span><div><b>${k[3]}</b><span>${k[2]}</span></div></button>`).join('')}</div>
  ${f?`<button class="link" data-act="ofst" data-id="">Mostrar todos (${os.length})</button>`:''}
  ${list(xs.map(ofRow),'Nada aqui.')}
  <p class="meta">Para gerar ofício de um pedido, abra o pedido e use "Gerar ofício". As indicações entram aqui quando você baixa o PDF do rascunho de indicação nos relatórios.</p>`};

/* ---------- Ligações com o resto do app ---------- */
document.addEventListener('click',e=>{if(e.target.closest('#tabs a')){S.eid=null;S.fid=null}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  const pausa=()=>{e.stopImmediatePropagation()};
  if(a==='ir'){S.eid=null;S.fid=null;return}
  if(a==='pv'){S.pv=id;S.fid=null;render();pausa()}
  else if(a==='agt'){S.agt=id;render();pausa()}
  else if(a==='eqt'){S.eqt=id;render();pausa()}
  else if(a==='fam'){$('modal').hidden=true;S.pid=null;S.fid=id;go('pessoas');pausa()}
  else if(a==='fvolta'){S.fid=null;S.pv='fam';render();pausa()}
  else if(a==='famadd'){formPessoa(membros(id)[0]?membros(id)[0].vila:undefined,id);pausa()}
  else if(a==='famnome'){const f=familias.find(x=>x.id===id);mini('Nome da família','ffn',`<label class="field"><span>Nome</span><input id="ffn-nome" required value="${esc(f.nome)}" autocomplete="off"></label><input type="hidden" id="ffn-id" value="${f.id}">`,'Salvar');pausa()}
  else if(a==='fampdf'){famPdf(familias.find(x=>x.id===id));pausa()}
  else if(a==='dlimpa'){S.st='';S.sc=false;S.cat='';S.dq='';render();pausa()}
  else if(a==='casamodo'){document.querySelectorAll('#fp-modo button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.id===id));$('fp-junto').hidden=id!=='junto';if(id==='nova'){$('fp-fam').value='nova';$('fp-casasel').innerHTML='';$('fp-parl').textContent='O que ela é na casa?';$('fp-par').value='Responsável';casaDup()}else{$('fp-casaq').focus();$('fp-casadup').hidden=true}pausa()}
  else if(a==='casapick'){casaPick(id);pausa()}
  else if(a==='casatroca'){$('fp-fam').value='nova';$('fp-casasel').innerHTML='';$('fp-casaq').value='';$('fp-casaq').focus();pausa()}
  else if(a==='ligar'){formLigar(pById(+id));pausa()}
  else if(a==='ligx'){const l=LIG[+id];if(!l)return;const i=+id;LIG.splice(i,1);logA('Família','Desfez a ligação: '+pById(l.a).nome+' ('+l.ab.toLowerCase()+') e '+pById(l.b).nome,{t:'p',id:l.b});render();desfazivel('Ligação desfeita',()=>{LIG.splice(i,0,l);render();toast('Desfeito')});pausa()}
  else if(a==='ent'){$('modal').hidden=true;S.eid=+id;go('entidades');pausa()}
  else if(a==='evolta'){S.eid=null;render();pausa()}
  else if(a==='novaent'){formEnt();pausa()}
  else if(a==='entedit'){formEnt(eById(+id));pausa()}
  else if(a==='etipo'){S.etipo=id;render();pausa()}
  else if(a==='entped'){const en=eById(+id),r=eResp(en);S.fdEnt=en.id;formDemanda(r&&r.p?r.p.id:undefined);pausa()}
  else if(a==='entof'){abrirOficio({ent:+id});pausa()}
  else if(a==='emrem'){const [ei,pi]=id.split('|').map(Number),en=eById(ei),k=en.mem.findIndex(m=>m.id===pi),m=en.mem[k];en.mem.splice(k,1);logA('Entidade','Tirou '+pById(pi).nome+' da entidade '+en.nome,{t:'e',id:ei});render();desfazivel('Pessoa tirada da entidade',()=>{en.mem.splice(k,0,m);render();toast('Desfeito')});pausa()}
  else if(a==='entrem'){const en=eById(+id);confirma({titulo:'Remover entidade',texto:`A entidade <strong>${esc(en.nome)}</strong> sai da lista. Os pedidos dela continuam guardados.`,botao:'Remover',perigo:1,motivo:'obrig',ok:m=>{en.arq={data:HOJE,quem:eu(),motivo:m};logA('Exclusão','Removeu a entidade '+en.nome+': '+m,{t:'e',id:en.id});S.eid=null;fecharModal(true);render();desfazivel('Entidade removida',()=>{delete en.arq;render();toast('Desfeito')})}});pausa()}
  else if(a==='novoof'){abrirOficio({});pausa()}
  else if(a==='of'){verOficio(+id);pausa()}
  else if(a==='ofst'){S.ofst=S.ofst===id?'':id;render();pausa()}
  else if(a==='ofreit'){abrirOficio({reit:+id});pausa()}
  else if(a==='ofpdf2'){const o=oficios.find(x=>x.id===+id);docPdf(o.tipo,o.txt,nomeArq(ofNome(o))+'.pdf');pausa()}
  else if(a==='novavis'){formVisita();pausa()}
  else if(a==='vis'){verVisita(+id);pausa()}
  else if(a==='visrem'){const v=visitas.find(x=>x.id===+id);v.arq={data:HOJE,quem:eu()};logA('Exclusão','Apagou a visita '+v.tipo.toLowerCase()+' em '+vN(v.vila)+' de '+dm(v.data),{t:'v',id:v.id});fecharModal(true);render();desfazivel('Visita apagada',()=>{delete v.arq;render();toast('Desfeito')});pausa()}
  else if(a==='fotover'){const [vi,fi]=id.split('|').map(Number),v=visitas.find(x=>x.id===vi);verAnexo(v,v.fotos.find(f=>f.id===fi),'v'+vi+'|'+fi);pausa()}
  else if(a==='anxver'){const [di,ai]=id.split('|').map(Number),d=demandas.find(x=>x.id===di);verAnexo(d,d.anx.find(x=>x.id===ai),di+'|'+ai);pausa()}
  else if(a==='anxbaixa'){const v=id.startsWith('v'),[x,y]=id.replace('v','').split('|').map(Number),o=v?visitas.find(z=>z.id===x).fotos.find(f=>f.id===y):demandas.find(z=>z.id===x).anx.find(f=>f.id===y);
    if(!DL){toast('Baixar não funciona nesta tela. Abra a prévia pelo app do Claude');return}const nome=o.tipo==='img'?(o.nome||'foto').replace(/\.[^.]+$/,'')+'.jpg':o.nome;DL.save({filename:nome,data:bytesDe(o.url).buffer}).then(()=>toast('Arquivo salvo'),er=>{if(!er||er.code!=='declined')toast('Não deu para salvar')});pausa()}
  else if(a==='anxrem'){const [di,ai]=id.split('|').map(Number),d=demandas.find(x=>x.id===di),k=d.anx.findIndex(x=>x.id===ai),x=d.anx[k];d.anx.splice(k,1);dHist(d,'Apagou o anexo '+x.nome);verDem(d.id);desfazivel('Anexo apagado',()=>{d.anx.splice(k,0,x);verDem(d.id);toast('Desfeito')});pausa()}
  else if(a==='lgpend'){S.lg.pend=!S.lg.pend;render();pausa()}
  else if(a==='logconf'){const x=LOG.find(z=>z.id===+id);x.conf={quem:eu(),data:HOJE,hora:agora()};render();pausa()}
  else if(a==='logconfall'){const xs=logF().filter(precisaConf);xs.forEach(x=>x.conf={quem:eu(),data:HOJE,hora:agora()});render();desfazivel(xs.length+' registros conferidos',()=>{xs.forEach(x=>x.conf=null);render();toast('Desfeito')});pausa()}
  else if(a==='logref'){const x=LOG.find(z=>z.id===+id),r=x&&x.ref;if(!r)return;pausa();
    if(r.t==='p'){if(pById(r.id)&&!pById(r.id).arq){S.pid=r.id;S.tab='dados';go('pessoas')}else toast('Esse cadastro foi removido')}
    else if(r.t==='d')verDem(r.id);else if(r.t==='e'){S.eid=r.id;go('entidades')}else if(r.t==='o')verOficio(r.id);else if(r.t==='v')verVisita(r.id)}
  else if(a==='irlog'){S.eqt='log';S.lg.pend=true;go('equipe');pausa()}
  else if(a==='irof'){S.ofst='late';go('oficios');pausa()}
},true);
document.addEventListener('submit',e=>{const f=e.target.id,val=id=>$(id).value.trim();
  if(f==='fen'){e.preventDefault();e.stopImmediatePropagation();const en=e.target.dataset.id?eById(+e.target.dataset.id):null,nv={nome:val('fen-nome'),tipo:marcado('fen-tipo')||'Outra',vila:$('fen-vila').value,tel:val('fen-tel'),end:val('fen-end'),cnpj:val('fen-cnpj'),obs:val('fen-obs')};

  else if(f==='fem'){e.preventDefault();e.stopImmediatePropagation();const en=eById(+e.target.dataset.id),pid=+$('fem-p').value,papel=val('fem-papel');if(!pid)return;en.mem.push({id:pid,papel});logA('Entidade','Ligou '+pById(pid).nome+' à entidade '+en.nome+' como '+papel.toLowerCase(),{t:'e',id:en.id});render();toast('Pessoa ligada')}

function termo(vid){const ps=visP().filter(p=>p.vila===vid);if(!ps.length)return null;const ds=dsDe(ps),ab=ds.filter(ativa),lt=ds.filter(late),sc=ds.filter(semContato),vv=visV().filter(v=>v.vila===vid&&v.ver).map(v=>v.data).sort(),ult=vv.pop(),dias=ult?diasEntre(ult,HOJE):null,semL=!lideres.some(l=>l.vila===vid),of=visO().filter(o=>o.vila===vid&&ofLate(o)).length;
  let n=100;const mot=[];
  if(lt.length){n-=lt.length*12;mot.push(lt.length+(lt.length>1?' pedidos atrasados':' pedido atrasado'))}
  if(sc.length){n-=sc.length*5;mot.push(sc.length+(sc.length>1?' pedidos sem contato':' pedido sem contato'))}
  const pr=Math.min(1,ab.length/ps.length);if(ab.length){n-=Math.round(pr*25);mot.push(ab.length+' em aberto para '+ps.length+(ps.length>1?' pessoas':' pessoa'))}
  if(dias==null){n-=30;mot.push('a vereadora ainda não foi')}else if(dias>60){n-=25;mot.push(dias+' dias sem a vereadora')}else if(dias>30){n-=15;mot.push(dias+' dias sem a vereadora')}else if(dias>14){n-=5;mot.push(dias+' dias sem a vereadora')}
  if(semL){n-=10;mot.push('sem liderança')}if(of){n-=of*8;mot.push(of+(of>1?' ofícios sem resposta':' ofício sem resposta'))}
  n=Math.max(0,Math.min(100,n));const nv=n>=70?['Bem atendida','var(--done)','atendida']:n>=40?['Atenção','var(--prog-ink)','andamento']:['Esquecida','var(--open)','aberta'];
  return {n,nivel:nv[0],cor:nv[1],cls:nv[2],mot,ps:ps.length,ab:ab.length,lt:lt.length,dias}}

const REGRAS=d=>`Você é o assistente do aplicativo Gabinete em Campo, do gabinete da vereadora Netinha Siqueira, em Novo Repartimento (PA). A equipe usa o aplicativo para acompanhar pessoas, famílias, vilas e os pedidos (demandas) da população.

- Responda só com base nos DADOS abaixo. Se a resposta não estiver nos dados, diga que essa informação não está cadastrada. Nunca invente nome, número, data ou situação.
- Os dados já são só o que a pessoa que pergunta tem permissão de ver. Se perguntarem de alguém que não está nos dados, diga que não encontrou essa pessoa entre as que ela acompanha.
- Escreva em português do Brasil, simples e direto, como um colega de equipe. Respostas curtas; use lista com "- " quando houver vários itens e **negrito** só no que for mais importante.
- Sempre que citar uma pessoa, escreva [[id|Nome]] com o id dela nos dados, para virar link.
- "oQueFaltaNaVila" são as demandas da comunidade que cada morador citou; use o ranking por vila para dizer o que cada vila mais precisa.
- Aponte o que precisa de atenção: prazo vencido, demanda sem responsável, ninguém falou com a pessoa, vila sem liderança.
- "Dona Fulana" e "seu Fulano" são formas de tratamento: procure pelo nome e pelo apelido.
- Não dê opinião política nem sugira ligar atendimento a voto.

DADOS (JSON):
${JSON.stringify(d)}`;
function mdIA(t){const vis=new Set(visP().map(p=>p.id)),inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\[\[(\d+)\|([^\]]+)\]\]/g,(m,id,n)=>vis.has(+id)?`<button class="link" data-act="pessoa" data-id="${+id}">${n}</button>`:n);
  let h='',ul=false;for(const raw of esc(t).split('\n')){const l=raw.trim();
    if(/^([-*•]|\d+[.)])\s+/.test(l)){if(!ul){h+='<ul>';ul=true}h+='<li>'+inl(l.replace(/^([-*•]|\d+[.)])\s+/,''))+'</li>';continue}
    if(ul){h+='</ul>';ul=false}if(!l)continue;h+='<p>'+inl(l.replace(/^#+\s*/,'<strong>').replace(/^(<strong>.*)$/,'$1</strong>'))+'</p>'}
  return h+(ul?'</ul>':'')}
const IA_FIM=new Set(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed']);
function rolaFim(){const l=$('ia-log');if(l&&l.lastElementChild)l.lastElementChild.scrollIntoView({block:'start',behavior:'smooth'})}
async function perguntar(q){q=q.trim();if(!q||S.iaBusy)return;
  if(!SAMPLE){S.ia.push({q,a:responder(q)});render();rolaFim();return}
  const it={q,a:'<p class="meta">Pensando...</p>'};S.ia.push(it);S.iaBusy=true;render();rolaFim();
  const bolha=()=>{const m=document.querySelectorAll('#ia-log .msg.ia');return m[m.length-1]};
  const turns=[{role:'user',content:REGRAS(dadosIA())}];
  S.ia.slice(-7,-1).forEach(m=>{if(m.raw){turns.push({role:'user',content:m.q},{role:'assistant',content:m.raw})}});
  turns.push({role:'user',content:q});
  IACTL=new AbortController();
  try{const r=await SAMPLE(turns,{modelTier:'quick',cache:false,signal:IACTL.signal,onText:({text})=>{const b=bolha();if(b)b.innerHTML=mdIA(text)}});
    it.raw=r.text;it.a=mdIA(r.text)+(r.truncated?'<p class="meta">A resposta foi cortada. Peça uma parte de cada vez.</p>':'')}
  catch(e){const parcial=e&&e.text?mdIA(e.text):'';
    if(e&&IA_FIM.has(e.code)){SAMPLE=null;it.a=responder(q)+'<p class="meta">A IA não está liberada aqui, então respondi no modo simples.</p>'}
    else if(e&&e.code==='cancelled')it.a=parcial||'<p class="meta">Pergunta cancelada.</p>';
    else if(e&&e.code==='rate_limited')it.a=parcial+'<p class="meta">Muitas perguntas seguidas. Espere um pouco e tente de novo.</p>';
    else it.a=parcial+'<p class="meta">Não consegui responder agora. Tente de novo.</p>'}
  finally{S.iaBusy=false;IACTL=null;render();rolaFim()}}

  $('sheet').innerHTML=`<div class="bar"><button class="iconbtn" data-act="ac-volta" aria-label="Voltar">${ic('back')}</button><h2 style="flex:1">${u?'Editar acesso':'Novo acesso'}</h2>${fecha}</div><form id="fac">
  <label class="field"><span>Nome</span><input id="ac-nome" required value="${esc(u?u.nome:'')}" autocomplete="off"></label>
  <label class="field"><span>Telefone (é o login)</span><input id="ac-tel" required type="tel" inputmode="tel" value="${esc(u?u.login:'')}" placeholder="(94) 9 0000-0000"></label>
  <label class="field"><span>Função</span><select id="ac-perfil">${opts([['lider','Liderança'],['area','Coordenador de área'],['geral','Coordenação geral']],pf)}</select></label>
  <div id="ac-lider"${pf==='lider'?'':' hidden'}><label class="field"><span>Vila da liderança</span><select id="ac-vila">${opts(vs.map(v=>[v.id,v.nome]),u&&u.vilas[0]||'')}</select></label></div>
  <div id="ac-area"${pf==='area'?'':' hidden'}><p class="meta">Vilas que essa pessoa coordena</p><div class="chk">${vs.map(v=>`<label class="chip"><input type="checkbox" name="ac-vs" value="${v.id}"${u&&u.vilas.includes(v.id)?' checked':''}>${esc(v.nome)}</label>`).join('')}</div></div>
  ${u?`<label class="check"><input type="checkbox" id="ac-ativo"${u.ativo?' checked':''}><span>Acesso ativo</span></label>`:''}
  <button class="btn wide">${u?'Salvar':'Criar acesso e gerar código'}</button>
  ${u?`<button type="button" class="btn ghost wide" data-act="ac-cod" data-id="${u.id}">Gerar código novo</button><p class="meta">Gerar código novo desconecta a pessoa de todos os aparelhos. Use se ela esqueceu o código ou perdeu o celular.</p>`:''}
  </form>`;$('modal').hidden=false;$('sheet').scrollTop=0;$('ac-perfil').onchange=()=>{const p=$('ac-perfil').value;$('ac-lider').hidden=p!=='lider';$('ac-area').hidden=p!=='area'}}
function mostraCodigo(u,cod,novo){const link=location.origin+location.pathname,txt=`Olá, ${u.nome.split(' ')[0]}! Seu acesso ao Gabinete em Campo:\n\nSite: ${link}\nTelefone: ${u.login}\nCódigo: ${cod}\n\nNo iPhone, abra o site no Safari e toque em Compartilhar > Adicionar à Tela de Início. No Android, abra no Chrome e toque em Instalar.\nNão passe esse código para ninguém.`;
  $('sheet').innerHTML=`<div class="bar"><h2>${novo?'Acesso criado':'Código novo'}</h2>${fecha}</div><div class="card" style="text-align:center"><p class="meta">Código de ${esc(u.nome)}</p><p style="font-size:2.2rem;font-weight:800;letter-spacing:.12em;margin:6px 0">${cod.slice(0,4)} ${cod.slice(4)}</p><p class="meta">Ele aparece só agora. Passe para a pessoa de forma reservada.</p></div>
  <label class="field"><span>Mensagem pronta para mandar no WhatsApp da pessoa</span><textarea id="ac-txt" rows="9">${esc(txt)}</textarea></label>
  <div class="two"><button class="btn" data-act="ac-copia">Copiar mensagem</button><a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/55${u.login}?text=${encodeURIComponent(txt)}">Abrir no WhatsApp</a></div><button class="btn ghost wide" data-act="ac-volta">Voltar para os acessos</button>`}
document.addEventListener('submit',async e=>{if(e.target.id!=='fac')return;e.preventDefault();e.stopImmediatePropagation();
  const p=$('ac-perfil').value;
  let vls=p==='lider'?[$('ac-vila').value]:p==='area'?[...document.querySelectorAll('input[name="ac-vs"]:checked')].map(x=>x.value):[];
  if(p==='area'&&!vls.length){toast('Marque pelo menos uma vila');return}
  const nome=$('ac-nome').value.trim();let liderId=null;
  if(p==='lider'){let l=lideres.find(x=>x.nome===nome&&x.vila===vls[0]);if(!l){l={id:'L'+uid().toString(36),nome,vila:vls[0]};lideres.push(l)}liderId=l.id}
  const dados={nome,login:$('ac-tel').value,perfil:p,vilas:vls,lider:liderId};const ant=e.target.dataset.uid;if(ant){dados.id=ant;dados.ativo=$('ac-ativo').checked}
  try{const r=await rpc('gec_usuario_salvar',{p_token:SY.token,p_dados:dados});
    if(p==='area'){if(!coords.some(c=>c.id===r.id))coords.push({id:r.id,nome});else coords.find(c=>c.id===r.id).nome=nome;vilas.forEach(v=>{if(vls.includes(v.id))v.coord=r.id;else if(v.coord===r.id)v.coord=''})}
    logA('Equipe',(ant?'Alterou o acesso de ':'Criou o acesso de ')+nome+' ('+PAP[p].toLowerCase()+')');varre();envia();
    if(r.codigo)mostraCodigo(r,r.codigo,true);else{toast('Acesso salvo');abreAcessos()}}
  catch(err){toast(/TELEFONE/.test(err.message)?'Telefone inválido: use DDD + número':/duplicate|unique/i.test(err.message)?'Esse telefone já tem acesso':'Não deu para salvar agora')}},true);
/* guarda o id do usuário no formulário de edição */
new MutationObserver(()=>{const f=$('fac');if(f&&!f.dataset.marcado){f.dataset.marcado='1';const b=f.querySelector('[data-act="ac-cod"]');if(b)f.dataset.uid=b.dataset.id}}).observe(document.body,{childList:true,subtree:true});
/* botão "Acessos da equipe" na tela Equipe (só coordenação geral) */
const _eq=V.equipe;V.equipe=function(){const h=_eq();if(S.perfil!=='geral')return h;const i=h.indexOf('</div>');return h.slice(0,i+6)+`<button class="btn" data-act="acessos">${ic('shield',18)}Acessos da equipe e cópia de segurança</button>`+h.slice(i+6)};
/* ---------- começar ---------- */
async function carregaLocal(){const s=await IDB.get('snap');zera();if(!s||!s.cols)return;for(const [c,a] of Object.entries(s.cols))if(COLS[c]&&Array.isArray(a))COLS[c].push(...a);cfgAplica(s.config);SY.seq=s.seq||0;
  const pend=new Set(s.fila||[]);for(const [c,a] of Object.entries(COLS))for(const x of a){const id=String(x.id);if(!pend.has(c+'|'+id))SY.last[c][id]=JSON.stringify(x)}if(!pend.has('config|tipos'))SY.last.config.tipos=JSON.stringify(cfgDoc())}
(async()=>{zera();const tok=await IDB.get('token');if(!tok)return;SY.token=tok;await carregaLocal();const s=await IDB.get('snap');
  if(s&&s.u){atualizaUsuario(s.u);entra()}
  if(navigator.onLine){try{const u=await rpc('gec_eu',{p_token:tok});atualizaUsuario(u);if(!S.on)entra();ciclo()}catch(e){if(ehSessao(e))sessaoAcabou()}}})();
/* aplicativo instalável e funcionando sem internet */
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.GEC_SYNC=SY;
})()}

</script>
